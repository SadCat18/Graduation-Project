name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --registry=https://registry.npmjs.org
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Frontend contract tests
        shell: bash
        run: |
          for test in frontend/tests/*.test.cjs; do
            node "$test"
          done
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Frontend end-to-end test
        run: npm run test:e2e
        working-directory: frontend

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --build-arg VCS_REF=${{ github.sha }} -t skatehub-backend:${{ github.sha }} .
      - name: Build frontend image
        run: docker build --build-arg VCS_REF=${{ github.sha }} -f frontend/Dockerfile -t skatehub-frontend:${{ github.sha }} .
