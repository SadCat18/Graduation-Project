server:
  port: ${SERVER_PORT:8080}
  tomcat:
    uri-encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: skatehub
  messages:
    encoding: UTF-8
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:

      repositories:
        enabled: false
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:3000ms}
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

jwt:
  secret: ${JWT_SECRET:}
  expiration-hours: ${JWT_EXPIRATION_HOURS:24}

admin:
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
  default-password: ${ADMIN_DEFAULT_PASSWORD:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:false}
    redis-failure-denies-protected: ${RATE_LIMIT_REDIS_FAILURE_DENIES_PROTECTED:true}
    login-ip-per-minute: ${RATE_LIMIT_LOGIN_IP_PER_MINUTE:10}
    login-account-per-five-minutes: ${RATE_LIMIT_LOGIN_ACCOUNT_PER_FIVE_MINUTES:10}
    register-ip-per-hour: ${RATE_LIMIT_REGISTER_IP_PER_HOUR:20}
    ai-user-per-minute: ${RATE_LIMIT_AI_USER_PER_MINUTE:10}
    upload-user-per-minute: ${RATE_LIMIT_UPLOAD_USER_PER_MINUTE:5}
    write-user-per-minute: ${RATE_LIMIT_WRITE_USER_PER_MINUTE:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

ai:
  provider: ${AI_PROVIDER:${AI_PROVIDER_DEFAULT:ark}}
  model: ${AI_MODEL:${AI_MODEL_DEFAULT:doubao-seed-2-1-lite-260915}}
  base-url: ${AI_BASE_URL:${AI_BASE_URL_DEFAULT:https://ark.cn-beijing.volces.com/api/v3/chat/completions}}
  api-key: ${AI_API_KEY:${AI_API_KEY_DEFAULT:${ARK_API_KEY:}}}
  defaults:
    provider: ${AI_PROVIDER_DEFAULT:${AI_PROVIDER:ark}}
    model: ${AI_MODEL_DEFAULT:${AI_MODEL:doubao-seed-2-1-lite-260915}}
    base-url: ${AI_BASE_URL_DEFAULT:${AI_BASE_URL:https://ark.cn-beijing.volces.com/api/v3/chat/completions}}
    api-key: ${AI_API_KEY_DEFAULT:${AI_API_KEY:${ARK_API_KEY:}}}
  news:
    provider: ${AI_PROVIDER_NEWS:}
    model: ${AI_MODEL_NEWS:}
    base-url: ${AI_BASE_URL_NEWS:}
    api-key: ${AI_API_KEY_NEWS:}
  scenes:
    coach_chat:
      provider: ${AI_PROVIDER_COACH_CHAT:}
      model: ${AI_MODEL_COACH_CHAT:doubao-seed-evolving}
    news_discovery:
      provider: ${AI_PROVIDER_NEWS_DISCOVERY:${AI_PROVIDER_NEWS:}}
      model: ${AI_MODEL_NEWS_DISCOVERY:${AI_MODEL_NEWS:doubao-seed-2-1-lite-260915}}
      base-url: ${AI_BASE_URL_NEWS_DISCOVERY:${AI_BASE_URL_NEWS:https://ark.cn-beijing.volces.com/api/v3/chat/completions}}
      api-key: ${AI_API_KEY_NEWS_DISCOVERY:${AI_API_KEY_NEWS:}}
    news_summary:
      provider: ${AI_PROVIDER_NEWS_SUMMARY:${AI_PROVIDER_NEWS:}}
      model: ${AI_MODEL_NEWS_SUMMARY:${AI_MODEL_NEWS:}}
      base-url: ${AI_BASE_URL_NEWS_SUMMARY:${AI_BASE_URL_NEWS:}}
      api-key: ${AI_API_KEY_NEWS_SUMMARY:${AI_API_KEY_NEWS:}}
    news_translate:
      provider: ${AI_PROVIDER_NEWS_TRANSLATE:${AI_PROVIDER_NEWS:}}
      model: ${AI_MODEL_NEWS_TRANSLATE:${AI_MODEL_NEWS:}}
      base-url: ${AI_BASE_URL_NEWS_TRANSLATE:${AI_BASE_URL_NEWS:}}
      api-key: ${AI_API_KEY_NEWS_TRANSLATE:${AI_API_KEY_NEWS:}}
    news_classify:
      provider: ${AI_PROVIDER_NEWS_CLASSIFY:${AI_PROVIDER_NEWS:}}
      model: ${AI_MODEL_NEWS_CLASSIFY:${AI_MODEL_NEWS:}}
      base-url: ${AI_BASE_URL_NEWS_CLASSIFY:${AI_BASE_URL_NEWS:}}
      api-key: ${AI_API_KEY_NEWS_CLASSIFY:${AI_API_KEY_NEWS:}}
    news_title_polish:
      provider: ${AI_PROVIDER_NEWS_TITLE_POLISH:${AI_PROVIDER_NEWS:}}
      model: ${AI_MODEL_NEWS_TITLE_POLISH:${AI_MODEL_NEWS:}}
      base-url: ${AI_BASE_URL_NEWS_TITLE_POLISH:${AI_BASE_URL_NEWS:}}
      api-key: ${AI_API_KEY_NEWS_TITLE_POLISH:${AI_API_KEY_NEWS:}}

news-sync:
  enabled: ${NEWS_SYNC_ENABLED:true}
  auto-publish: ${NEWS_SYNC_AUTO_PUBLISH:false}
  lookback-days: ${NEWS_SYNC_LOOKBACK_DAYS:7}
  ai-search:
    enabled: ${NEWS_SYNC_AI_SEARCH_ENABLED:true}
    max-items: ${NEWS_SYNC_AI_SEARCH_MAX_ITEMS:6}
    source-id: ${NEWS_SYNC_AI_SEARCH_SOURCE_ID:999}
    source-name: ${NEWS_SYNC_AI_SEARCH_SOURCE_NAME:AI全网搜索}
    source-url: ${NEWS_SYNC_AI_SEARCH_SOURCE_URL:ai://ark/web-search}
