services:
  mysql:
    image: mysql:8.4
    container_name: se1-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: se1-redis
    restart: unless-stopped
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then
      exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\";
      else
      exec redis-server --appendonly yes;
      fi"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: se1-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
      DB_USERNAME: ${DB_USERNAME:-${MYSQL_USER}}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-true}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-none}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REDIS_FAILURE_DENIES_PROTECTED: ${RATE_LIMIT_REDIS_FAILURE_DENIES_PROTECTED:-true}
      # AI 网关透传；未设置的变量留空即可，后端会按 默认配置 -> 资讯配置 的顺序合并
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER_DEFAULT: ${AI_PROVIDER_DEFAULT:-ark}
      AI_MODEL_DEFAULT: ${AI_MODEL_DEFAULT:-doubao-seed-2-1-lite-260915}
      AI_BASE_URL_DEFAULT: ${AI_BASE_URL_DEFAULT:-}
      AI_API_KEY_DEFAULT: ${AI_API_KEY_DEFAULT:-}
      AI_PROVIDER_NEWS: ${AI_PROVIDER_NEWS:-}
      AI_MODEL_NEWS: ${AI_MODEL_NEWS:-}
      AI_BASE_URL_NEWS: ${AI_BASE_URL_NEWS:-}
      AI_API_KEY_NEWS: ${AI_API_KEY_NEWS:-}
      AI_PROVIDER_COACH_CHAT: ${AI_PROVIDER_COACH_CHAT:-}
      AI_MODEL_COACH_CHAT: ${AI_MODEL_COACH_CHAT:-doubao-seed-evolving}
    volumes:
      - ../../upload:/app/upload

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        VUE_APP_AMAP_KEY: ${AMAP_KEY:-}
        VUE_APP_AMAP_SERVICE_HOST: ${AMAP_SERVICE_HOST:-}
    container_name: se1-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
      SERVER_NAME: ${SERVER_NAME:-_}
      AMAP_SECURITY_JS_CODE: ${AMAP_SECURITY_JS_CODE:-}
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  mysql_data:
  redis_data:
